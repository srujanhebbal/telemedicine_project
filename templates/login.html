{% extends "base.html" %}
{% block title %}Login | MediConnect{% endblock %}
{% block body %}
<main class="auth-screen">
    <a class="brand auth-brand" href="{{ url_for('auth.home') }}"><span class="brand-mark">+</span>MediConnect</a>
    <section class="auth-card glass">
        <div>
            <span class="eyebrow">Welcome back</span>
            <h1>Login to your secure portal.</h1>
        </div>
        <form method="post" class="stack-form" data-validate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
            <label>Password<input type="password" name="password" required minlength="8" placeholder="Minimum 8 characters"></label>
            <button class="btn primary full" type="submit">Login</button>
        </form>
        <div class="auth-links">
            <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
            <a href="{{ url_for('auth.register') }}">Create account</a>
        </div>
    </section>
</main>
{% endblock %}
