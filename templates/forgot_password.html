{% extends "base.html" %}
{% block title %}Forgot Password | MediConnect{% endblock %}
{% block body %}
<main class="auth-screen">
    <section class="auth-card glass">
        <span class="eyebrow">Password recovery</span>
        <h1>Reset flow UI</h1>
        <p class="muted">Connect this form to your email provider before production deployment.</p>
        <form class="stack-form">
            <label>Email<input type="email" required placeholder="you@example.com"></label>
            <button class="btn primary full" type="button">Request reset link</button>
        </form>
        <div class="auth-links"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
    </section>
</main>
{% endblock %}
