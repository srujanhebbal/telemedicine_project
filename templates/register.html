{% extends "base.html" %}
{% block title %}Register | MediConnect{% endblock %}
{% block body %}
<main class="auth-screen">
    <a class="brand auth-brand" href="{{ url_for('auth.home') }}"><span class="brand-mark">+</span>MediConnect</a>
    <section class="auth-card glass wide">
        <div>
            <span class="eyebrow">Create account</span>
            <h1>Register as a patient or doctor.</h1>
        </div>
        <form method="post" class="stack-form grid-form" data-validate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label>Full name<input name="name" required></label>
            <label>Email<input type="email" name="email" required></label>
            <label>Phone<input name="phone" required></label>
            <label>Password<input type="password" name="password" minlength="8" required></label>
            <label>Role
                <select name="role" id="roleSelect" required>
                    <option value="patient">Patient</option>
                    <option value="doctor">Doctor</option>
                </select>
            </label>
            <label>Blood group<input name="blood_group" placeholder="O+"></label>
            <label class="doctor-only hidden">Specialization<input name="specialization" placeholder="Cardiology"></label>
            <label class="doctor-only hidden">Qualification<input name="qualification" placeholder="MD"></label>
            <label class="doctor-only hidden">Experience years<input type="number" min="0" name="experience_years" value="0"></label>
            <label class="doctor-only hidden">Consultation fee<input type="number" min="0" name="consultation_fee" value="50"></label>
            <button class="btn primary full grid-span" type="submit">Create secure account</button>
        </form>
        <div class="auth-links"><a href="{{ url_for('auth.login') }}">Already have an account?</a></div>
    </section>
</main>
{% endblock %}
