{% extends "base.html" %}
{% block title %}{{ code }} | MediConnect{% endblock %}
{% block body %}
<main class="auth-screen">
    <section class="auth-card glass">
        <span class="eyebrow">Error {{ code }}</span>
        <h1>{{ message }}</h1>
        <a class="btn primary" href="{{ url_for('auth.login') }}">Return to portal</a>
    </section>
</main>
{% endblock %}
